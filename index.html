<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/bee_social_logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>BeeSocial — Creative Social Media & Digital Marketing Agency</title>
    <meta name="description" content="BeeSocial is a creative social media and digital marketing agency that helps brands stand out, engage audiences, and grow online through scroll-stopping content and strategic campaigns." />
    <meta name="keywords" content="Social Media Marketing, Digital Marketing, Creative Agency, Instagram Marketing, Content Creation, Brand Growth, Reels, Social Strategy, India" />
    <meta name="author" content="BeeSocial" />
    <meta name="robots" content="index, follow" />
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://thebeesocial.in" />
    <meta property="og:title" content="BeeSocial — Creative Social Media & Digital Marketing Agency" />
    <meta property="og:description" content="Stand out on social media with BeeSocial. We craft scroll-stopping content, run high-impact campaigns, and help brands build engaged communities that convert." />
    <meta property="og:image" content="https://thebeesocial.in/bee_social_logo.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://thebeesocial.in" />
    <meta name="twitter:title" content="BeeSocial — Creative Social Media & Digital Marketing Agency" />
    <meta name="twitter:description" content="Stand out on social media with BeeSocial. We craft scroll-stopping content, run high-impact campaigns, and help brands build engaged communities that convert." />
    <meta name="twitter:image" content="https://thebeesocial.in/bee_social_logo.png" />

    <!-- Theme & Mobile Optimization -->
    <meta name="theme-color" content="#0F172A" />
    <link rel="icon" type="image/png" sizes="32x32" href="/bee_social_logo.png" />
    <link rel="apple-touch-icon" href="/bee_social_logo.png" />

    <!-- Google Fonts Preconnect & Preload -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800;900&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800;900&display=swap" media="print" onload="this.media='all'" />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800;900&display=swap" />
    </noscript>

    <!-- Organization, WebSite & ProfessionalService JSON-LD Schema -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": ["Organization", "ProfessionalService"],
          "@id": "https://thebeesocial.in/#organization",
          "name": "BeeSocial",
          "url": "https://thebeesocial.in",
          "logo": "https://thebeesocial.in/bee_social_logo.png",
          "image": "https://thebeesocial.in/bee_social_logo.png",
          "description": "Creative social media and digital marketing agency helping brands grow through engaging content, strategic campaigns, and community building.",
          "telephone": "+917020800621",
          "sameAs": [
            "https://www.instagram.com/beesocial._"
          ],
          "address": {
            "@type": "PostalAddress",
            "addressCountry": "IN"
          }
        },
        {
          "@type": "WebSite",
          "@id": "https://thebeesocial.in/#website",
          "url": "https://thebeesocial.in",
          "name": "BeeSocial",
          "publisher": {
            "@id": "/#organization"
          },
          "potentialAction": {
            "@type": "SearchAction",
            "target": "/blogs?q={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
